stages:
  - test
  - publish
  - deploy

default:
  before_script:
    - set -eu

variables:
  HARBOR_HOST: harbor.localtest.me:8443
  HARBOR_PROJECT: demo
  HARBOR_IMAGE: $HARBOR_HOST/$HARBOR_PROJECT/$CI_PROJECT_NAME

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

Run Tests:
  stage: test
  image:
    name: python:3.11.13-slim-bookworm
    entrypoint: [""]
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  script:
    - pip install --quiet poetry==2.5.1
    - poetry install --no-interaction
    - poetry run pytest --junitxml python.junit.xml
  artifacts:
    when: always
    paths: [python.junit.xml]
    reports:
      junit: python.junit.xml
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/

Publish Image:
  stage: publish
  needs:
    - job: Run Tests
      artifacts: false
  interruptible: false
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - b64_auth=$(printf '%s:%s' "$HARBOR_ROBOT_USER" "$HARBOR_ROBOT_SECRET" | base64 | tr -d '\n')
    - >-
      printf '{"auths": {"%s": {"auth": "%s"}}}' "$HARBOR_HOST" "$b64_auth"
      >/kaniko/.docker/config.json
    - >-
      /kaniko/executor
      --reproducible
      --use-new-run
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$HARBOR_IMAGE:$IMAGE_TAG"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        IMAGE_TAG: main_$CI_COMMIT_SHORT_SHA
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
      variables:
        IMAGE_TAG: $CI_COMMIT_TAG

Deploy:
  stage: deploy
  tags: [deploy]
  needs:
    - job: Publish Image
      artifacts: false
  interruptible: false
  variables:
    GIT_CLONE_PATH: $CI_BUILDS_DIR/$CI_PROJECT_PATH_SLUG
  environment:
    name: prom
    url: http://localhost:8088
  script:
    - printf '%s' "$HARBOR_ROBOT_SECRET" | docker login --username "$HARBOR_ROBOT_USER" --password-stdin "$HARBOR_HOST"
    - cd deploy
    - ansible-playbook audit-svc.play.yml --extra-vars "audit_svc__image_tag=$CI_COMMIT_TAG"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/